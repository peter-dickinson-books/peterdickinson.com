{{ partial "header.html" . }}
<div class="container book-list">
  <div class="gr-3 gr-3@tablet gr-12@mobile">
    {{ partial "books_menu.html" . }}
  </div>
  <div class="gr-9 gr-9@tablet gr-12@mobile">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <ul class="side-menu">
      {{ range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> ({{ len .Pages }})</li>
      {{ end }}
    </ul>
  </div>
</div>
{{ partial "footer.html" . }}
